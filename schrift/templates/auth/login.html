{% extends "auth/layout.html" %}
{% block title %}{{ t("Inloggen") }} · Schrift{% endblock %}
{% block card %}
<h1 class="mb-5 text-lg font-semibold">{{ t("Inloggen") }}</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="flex flex-col gap-4">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field-label">{{ t("Gebruikersnaam") }}
    <input class="input" name="username" autocomplete="username" autocapitalize="none" required autofocus>
  </label>
  <label class="field-label">{{ t("Wachtwoord") }}
    <input class="input" type="password" name="password" autocomplete="current-password" required>
  </label>
  <button class="btn btn-primary mt-1 w-full">{{ t("Inloggen") }}</button>
</form>
{% endblock %}
