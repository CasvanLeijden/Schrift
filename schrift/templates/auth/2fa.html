{% extends "auth/layout.html" %}
{% block title %}{{ t("Verificatiecode") }} · Schrift{% endblock %}
{% block card %}
<h1 class="mb-2 text-lg font-semibold">{{ t("Verificatiecode") }}</h1>
<p class="mb-5 text-sm text-muted">{{ t("Typ de code uit je authenticator-app, of een van je herstelcodes.") }}</p>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login/2fa" class="flex flex-col gap-4">
  <label class="field-label">{{ t("Code") }}
    <input class="input text-lg tracking-widest" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
  </label>
  <button class="btn btn-primary w-full">{{ t("Verder") }}</button>
</form>
<p class="mt-5 text-center text-sm"><a href="/login">{{ t("Terug") }}</a></p>
{% endblock %}
