[project]
name = "schrift"
version = "0.1.0"
description = "Self-hosted Markdown notes, wiki and tasks with CalDAV and an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "itsdangerous>=2.2",
    "icalendar>=6.0",
    "pypdf>=5.0",
    "numpy>=2.0",
    "mcp>=1.20",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.5"]

[project.scripts]
schrift = "schrift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "ruff>=0.8",
]

[tool.uv]
# Only resolve releases that are at least two weeks old.
exclude-newer = "2026-09-30T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schrift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File",
    "fastapi.Body", "fastapi.Header", "fastapi.UploadFile",
]
