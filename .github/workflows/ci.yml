name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: scripts/tailwind.sh --minify
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t schrift:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name schrift -p 8000:8000 \
            -e SCHRIFT_SECRET_KEY=ci -e SCHRIFT_SEMANTIC_SEARCH=false schrift:ci
          for i in $(seq 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/login | grep -q Inloggen
          docker exec schrift schrift user create admin --admin --password ci-wachtwoord-123
          docker exec schrift ls /data/schrift.db
          docker logs schrift

  publish:
    # Only for main, and only after tests and the container smoke test passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/schrift
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
