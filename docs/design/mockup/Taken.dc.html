<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Schrift: taken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443B0}a:hover{color:#1A3390}
.app{--bg:#FFFFFF;--side:#F4F6F9;--line:#E2E6EC;--text:#19202B;--muted:#5A6473;--icon:#7B8492;--accent:#2443B0;--accent-soft:#E8ECFA;--margin:#E0605A;--late:#B3261E;--late-soft:#FBEAE8;--pill:#EEF1F6;--hover:#E9EDF2}
.app.dark{--bg:#16191F;--side:#1C2028;--line:#2C323C;--text:#E5E8EE;--muted:#A2ABB8;--icon:#8B94A2;--accent:#9DB1FF;--accent-soft:#252D48;--margin:#A9504B;--late:#FF9B92;--late-soft:#3A2224;--pill:#262B35;--hover:#252A33}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.app button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app button:focus-visible,.app a:focus-visible,.app input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--text);text-decoration:none;box-sizing:border-box}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav svg{flex:none;color:var(--icon)}
.nav.on svg{color:var(--accent)}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.group{font-size:12px;color:var(--muted);padding:18px 10px 6px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:var(--pill);font-size:13px;color:var(--muted);text-decoration:none}
.seg{height:32px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--muted) !important}
.seg:hover{background:var(--hover)}
.seg.on{background:var(--text);color:var(--bg) !important}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px}
.row:hover{background:var(--side)}
.box{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--icon);border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0 !important}
.box.done{background:var(--accent);border-color:var(--accent);color:var(--bg) !important}
.due{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500}
.due.late{background:var(--late-soft);color:var(--late)}
.src{font-size:13px;color:var(--muted);text-decoration:none}
.src:hover{color:var(--accent);text-decoration:underline}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--icon) !important}
.iconbtn:hover{background:var(--hover)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.track{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;display:inline-block}
.track.on{background:var(--accent)}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF}
.track.on .knob{left:16px}
</style>
</helmet>
<div class="app {{themeClass}}" style="display: flex; flex-wrap: wrap; min-height: 980px">

<nav aria-label="Navigatie" style="flex: 1 1 248px; max-width: 100%; background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 14px">
<span style="font-family: 'Literata', serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Schrift</span>
<button class="iconbtn" aria-label="Nieuwe notitie"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; color: var(--muted); margin-bottom: 10px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" placeholder="Zoeken" aria-label="Zoeken in notities" style="border: 0; background: none; outline: none; font: inherit; color: var(--text); flex: 1; min-width: 0">
<kbd style="font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px">Ctrl K</kbd>
</label>
<a class="nav on" href="#" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Taken<span class="count" style="color: var(--accent)">{{openCount}}</span></a>
<a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l1.5 3h5L16 13h4"></path><path d="M5.5 6h13L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"></path></svg>Inbox<span class="count">3</span></a>
<div class="group">Mappen</div>
<a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17z"></path></svg>Prive</a>
<a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17z"></path></svg>Forfacts</a>
<a class="nav" href="Main.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17z"></path></svg>ZOKA</a>
<div class="group">Tags</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px">
<a class="chip" href="#">klant-x</a>
<a class="chip" href="#">offerte</a>
<a class="chip" href="#">q4</a>
<a class="chip" href="#">recepten</a>
</div>
<div style="margin-top: auto; padding-top: 24px; display: flex; align-items: center; gap: 10px; padding-left: 10px">
<span style="width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">C</span>
<span style="font-size: 14px">Cas</span>
<button class="iconbtn" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="margin-left: auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button>
<a class="iconbtn" href="Instellingen.dc.html" aria-label="Instellingen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg></a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; justify-content: center; padding: 40px 24px 80px; box-sizing: border-box">
<div style="width: 100%; max-width: 820px">
<h1 style="font-family: 'Literata', serif; font-size: 34px; line-height: 1.2; font-weight: 600; margin: 0 0 20px; letter-spacing: -0.015em">Taken</h1>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button class="seg {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button>
</sc-for>
<button class="toggle" role="switch" aria-checked="{{showDone}}" onClick="{{toggleDone}}" style="margin-left: auto; min-height: 36px"><span class="track {{doneTrack}}"><span class="knob"></span></span>Toon afgerond</button>
</div>

<label style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--icon)"><path d="M12 5v14M5 12h14"></path></svg>
<input value="{{newText}}" onChange="{{onInput}}" onKeyDown="{{onKey}}" placeholder="Nieuwe taak, Enter om toe te voegen aan Inbox" aria-label="Nieuwe taak" style="border: 0; background: none; outline: none; font: inherit; font-size: 15px; color: var(--text); flex: 1; min-width: 0">
</label>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="margin-top: 22px">
<h2 style="font-size: 13px; font-weight: 600; color: {{g.color}}; margin: 0 0 4px; padding: 0 12px">{{g.label}} <span style="font-weight: 400; color: var(--muted)">{{g.count}}</span></h2>
<sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
<div class="row">
<button class="box {{t.cls}}" aria-pressed="{{t.done}}" aria-label="{{t.ariaLabel}}" onClick="{{t.toggle}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if></button>
<div style="flex: 1; min-width: 0">
<div style="font-size: 15px; line-height: 1.4; color: {{t.color}}">{{t.title}}</div>
<a class="src" href="{{t.href}}">{{t.source}}</a>
</div>
<sc-if value="{{t.hasDue}}" hint-placeholder-val="{{ true }}"><span class="due {{t.dueCls}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>{{t.due}}</span></sc-if>
</div>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dark: null, filter: 'Alles', showDone: false, newText: '',
      tasks: [
        { id: 1, title: 'BTW-aangifte Q3 controleren', folder: 'Forfacts', note: 'Administratie Q3', group: 'Verlopen', due: 'vr 10 okt', done: false },
        { id: 2, title: 'Huur overmaken', folder: 'Prive', note: 'Inbox', group: 'Vandaag', due: 'vandaag, 09:00', done: false },
        { id: 3, title: 'Feedback geven op wireframes', folder: 'ZOKA', note: 'Projectplan fase 2', group: 'Vandaag', due: 'vandaag, 15:00', done: false },
        { id: 4, title: 'Offerte sturen voor fase 2', folder: 'ZOKA', note: 'Overleg Klant X: planning Q4', group: 'Komende 7 dagen', due: 'ma 20 okt, 14:00', done: false },
        { id: 5, title: 'Tandarts bellen', folder: 'Inbox', note: 'Inbox', group: 'Komende 7 dagen', due: 'do 16 okt', done: false },
        { id: 6, title: 'Planning delen met het team', folder: 'ZOKA', note: 'Overleg Klant X: planning Q4', group: 'Zonder datum', due: '', done: false },
        { id: 7, title: 'Boek terugbrengen naar bibliotheek', folder: 'Inbox', note: 'Inbox', group: 'Zonder datum', due: '', done: false },
        { id: 8, title: 'Agenda rondsturen', folder: 'ZOKA', note: 'Overleg Klant X: planning Q4', group: 'Afgerond', due: '', done: true }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const dark = s.dark ?? (this.props.dark ?? false);
    const filters = ['Alles', 'Prive', 'Forfacts', 'ZOKA', 'Inbox'].map((label) => ({
      label, on: s.filter === label, cls: s.filter === label ? 'on' : '',
      pick: () => this.setState({ filter: label })
    }));
    const order = ['Verlopen', 'Vandaag', 'Komende 7 dagen', 'Zonder datum', 'Afgerond'];
    const visible = s.tasks.filter((t) => (s.filter === 'Alles' || t.folder === s.filter) && (s.showDone || !t.done));
    const groups = order.map((label) => {
      const list = visible.filter((t) => (t.done ? 'Afgerond' : t.group) === label);
      return {
        label, count: String(list.length),
        color: label === 'Verlopen' ? 'var(--late)' : 'var(--text)',
        tasks: list.map((t) => ({
          title: t.title, done: t.done, cls: t.done ? 'done' : '',
          color: t.done ? 'var(--muted)' : 'var(--text)',
          ariaLabel: (t.done ? 'Heropen: ' : 'Afvinken: ') + t.title,
          source: t.folder === 'Inbox' ? 'Inbox' : t.folder + ' › ' + t.note,
          href: t.note.indexOf('Klant X') >= 0 ? 'Main.dc.html' : '#',
          hasDue: !!t.due, due: t.due, dueCls: t.group === 'Verlopen' && !t.done ? 'late' : '',
          toggle: () => this.setState({ tasks: this.state.tasks.map((x) => x.id === t.id ? { ...x, done: !x.done } : x) })
        }))
      };
    }).filter((g) => g.tasks.length > 0);
    return {
      themeClass: dark ? 'dark' : '',
      themeLabel: dark ? 'Licht thema' : 'Donker thema',
      toggleTheme: () => this.setState({ dark: !dark }),
      filters, groups,
      openCount: String(s.tasks.filter((t) => !t.done).length),
      showDone: s.showDone, doneTrack: s.showDone ? 'on' : '',
      toggleDone: () => this.setState({ showDone: !s.showDone }),
      newText: s.newText,
      onInput: (e) => this.setState({ newText: e.target.value }),
      onKey: (e) => {
        if (e.key === 'Enter' && this.state.newText.trim()) {
          const id = Date.now();
          this.setState({ newText: '', tasks: [{ id, title: this.state.newText.trim(), folder: 'Inbox', note: 'Inbox', group: 'Zonder datum', due: '', done: false }, ...this.state.tasks] });
        }
      }
    };
  }
}
</script>
</body>
</html>
