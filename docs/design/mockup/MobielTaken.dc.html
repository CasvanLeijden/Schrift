<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Schrift mobiel: taken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9DB1FF}a:hover{color:#C2CFFF}
.app{--bg:#16191F;--side:#1C2028;--line:#2C323C;--text:#E5E8EE;--muted:#A2ABB8;--icon:#8B94A2;--accent:#9DB1FF;--accent-soft:#252D48;--late:#FF9B92;--late-soft:#3A2224;--pill:#262B35}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.app button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app button:focus-visible,.app a:focus-visible,.app input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.seg{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:14px;background:var(--pill);color:var(--muted) !important}
.seg.on{background:var(--text);color:var(--bg) !important}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.box{flex:none;width:22px;height:22px;margin-top:1px;border:1.5px solid var(--icon);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 !important}
.box.done{background:var(--accent);border-color:var(--accent);color:var(--bg) !important}
.due{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500}
.due.late{background:var(--late-soft);color:var(--late)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;color:var(--muted);text-decoration:none}
.tab.on{color:var(--accent)}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; overflow-y: auto; padding: 20px 20px 24px">
<h1 style="font-family: 'Literata', serif; font-size: 30px; font-weight: 600; margin: 8px 0 16px; letter-spacing: -0.015em">Taken</h1>
<div style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px 14px; padding: 0 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button class="seg {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--icon)"><path d="M12 5v14M5 12h14"></path></svg>
<input placeholder="Nieuwe taak" aria-label="Nieuwe taak" style="border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--text); flex: 1; min-width: 0">
</label>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="margin-top: 22px">
<h2 style="font-size: 13px; font-weight: 600; color: {{g.color}}; margin: 0">{{g.label}}</h2>
<sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
<div class="row">
<button class="box {{t.cls}}" aria-pressed="{{t.done}}" aria-label="{{t.ariaLabel}}" onClick="{{t.toggle}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if></button>
<div style="flex: 1; min-width: 0">
<div style="font-size: 16px; line-height: 1.35; color: {{t.color}}">{{t.title}}</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px">
<sc-if value="{{t.hasDue}}" hint-placeholder-val="{{ true }}"><span class="due {{t.dueCls}}">{{t.due}}</span></sc-if>
<span style="font-size: 13px; color: var(--muted)">{{t.source}}</span>
</div>
</div>
</div>
</sc-for>
</section>
</sc-for>
</div>

<nav aria-label="Hoofdmenu" style="flex: none; display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: 14px">
<a class="tab" href="MobielNotitie.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7"></path></svg>Notities</a>
<a class="tab on" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Taken</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Zoeken</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nieuw</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'Alles',
      tasks: [
        { id: 1, title: 'BTW-aangifte Q3 controleren', folder: 'Forfacts', group: 'Verlopen', due: 'vr 10 okt', done: false },
        { id: 2, title: 'Huur overmaken', folder: 'Prive', group: 'Vandaag', due: '09:00', done: false },
        { id: 3, title: 'Feedback geven op wireframes', folder: 'ZOKA', group: 'Vandaag', due: '15:00', done: false },
        { id: 4, title: 'Offerte sturen voor fase 2', folder: 'ZOKA', group: 'Komende 7 dagen', due: 'ma 20 okt, 14:00', done: false },
        { id: 5, title: 'Tandarts bellen', folder: 'Inbox', group: 'Komende 7 dagen', due: 'do 16 okt', done: false },
        { id: 6, title: 'Planning delen met het team', folder: 'ZOKA', group: 'Zonder datum', due: '', done: false }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const filters = ['Alles', 'Prive', 'Forfacts', 'ZOKA', 'Inbox'].map((label) => ({
      label, on: s.filter === label, cls: s.filter === label ? 'on' : '',
      pick: () => this.setState({ filter: label })
    }));
    const visible = s.tasks.filter((t) => s.filter === 'Alles' || t.folder === s.filter);
    const groups = ['Verlopen', 'Vandaag', 'Komende 7 dagen', 'Zonder datum'].map((label) => ({
      label, color: label === 'Verlopen' ? 'var(--late)' : 'var(--muted)',
      tasks: visible.filter((t) => t.group === label).map((t) => ({
        title: t.title, done: t.done, cls: t.done ? 'done' : '',
        color: t.done ? 'var(--muted)' : 'var(--text)',
        ariaLabel: (t.done ? 'Heropen: ' : 'Afvinken: ') + t.title,
        source: t.folder, hasDue: !!t.due, due: t.due,
        dueCls: label === 'Verlopen' ? 'late' : '',
        toggle: () => this.setState({ tasks: this.state.tasks.map((x) => x.id === t.id ? { ...x, done: !x.done } : x) })
      }))
    })).filter((g) => g.tasks.length > 0);
    return { filters, groups };
  }
}
</script>
</body>
</html>
